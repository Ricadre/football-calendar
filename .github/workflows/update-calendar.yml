name: Update football calendars
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config.py'
      - 'requirements.txt'
      - 'data/venues.json'
      - '.github/workflows/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: football-calendar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install calendar reader
        run: python -m pip install -r requirements.txt
      - name: Test calendar date and update behavior
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Refresh official and public fixtures
        id: update
        continue-on-error: true
        run: python scripts/update.py
      - name: Save calendars and last successful fixture data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fixtures.json data/milan-crosscheck.json calendars index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update football fixtures and refresh status'
            git push
          fi
      - name: Prepare calendar hosting
        run: |
          mkdir -p site-output
          cp index.html site-output/
          cp -R calendars site-output/
          touch site-output/.nojekyll
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site-output
      - name: Publish calendar addresses
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Surface any source refresh failure
        if: steps.update.outcome == 'failure'
        run: |
          echo 'One or more sources could not refresh. Last known fixtures were preserved. See the refresh step.'
          exit 1
